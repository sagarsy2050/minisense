[project]
name = "minisense"
version = "0.1.0"
description = "MiniSense — a survey analysis multi-agent system with local RAG, running on Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "requests>=2.31,<3",
    "numpy>=1.26,<3",
    "faiss-cpu>=1.8,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",   # required by fastapi.testclient.TestClient
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
minisense = "minisense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minisense = ["py.typed"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter/reviewer judgment, not a hard gate

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. are designed to be called in argument
# defaults — that's not the mutable-default-argument bug B008 looks for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
